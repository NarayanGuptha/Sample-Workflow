name : Shell commands

on : [push]

jobs :
  run-shell-commands : 
    runs-on : ubuntu-latest
    
    steps:
      - name: string
        run: echo " Welcome to Devops hints "
      - name: multiline script
        run: |
          node -v
          npm -v
      - name: Python
        run: |    
         import platform
          print (platform.processor())
         Shell: Python

  run-window-commands :
    runs-on: window-latest
    steps:
    - name: Director Powershell
      run: Get-Location
    - name: Director Bash
      run: pwd
      shell: bash